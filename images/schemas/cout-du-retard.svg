<svg font-family="Inter, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450"><rect width="780" height="450" fill="#FFFFFF"/><path d="M 290 150 L 520 150 L 520 290 L 330 290 C 310 290 310 150 290 150 Z" fill="#fef2f2"/><line x1="100" y1="340" x2="530" y2="340" stroke="#9ca3af" stroke-width="1.2"/><polygon points="536,340 528,336 528,344" fill="#9ca3af"/><line x1="100" y1="340" x2="100" y2="44" stroke="#9ca3af" stroke-width="1.2"/><polygon points="100,38 96,46 104,46" fill="#9ca3af"/><text x="78" y="195.0" font-size="12" font-weight="700" fill="#374151" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 78 195.0)">Valeur obtenue à la livraison</text><text x="310.0" y="382" font-size="12" font-weight="700" fill="#374151" text-anchor="middle" dominant-baseline="central">Date de livraison</text><line x1="100" y1="340" x2="100" y2="345" stroke="#9ca3af" stroke-width="1.2"/><text x="100" y="358" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">aujourd'hui</text><line x1="290" y1="340" x2="290" y2="345" stroke="#9ca3af" stroke-width="1.2"/><text x="290" y="358" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">dans 6 semaines</text><line x1="520" y1="340" x2="520" y2="345" stroke="#9ca3af" stroke-width="1.2"/><text x="520" y="358" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="central">dans 3 mois</text><line x1="290" y1="50" x2="290" y2="340" stroke="#e8590c" stroke-width="1" stroke-dasharray="4,4"/><text x="298" y="56" font-size="11" font-weight="600" fill="#b54708" text-anchor="start" dominant-baseline="central">Entrée en vigueur de la ZFE</text><line x1="100" y1="105" x2="520" y2="105" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/><path d="M 100 150 L 290 150 C 310 150 310 290 330 290 L 520 290" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="330" y1="150" x2="520" y2="150" stroke="#e8590c" stroke-width="1" stroke-dasharray="3,4" opacity="0.7"/><line x1="440" y1="156" x2="440" y2="282" stroke="#dc2626" stroke-width="1.4"/><polygon points="440,288 436,280 444,280" fill="#dc2626"/><text x="430" y="212.0" font-size="11" font-weight="600" fill="#dc2626" text-anchor="end" dominant-baseline="central">Ce que coûte</text><text x="430" y="228.0" font-size="11" font-weight="600" fill="#dc2626" text-anchor="end" dominant-baseline="central">le retard</text><text x="550" y="97" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="central">Mode sombre</text><text x="550" y="114" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="central">même valeur dans 3 mois :</text><text x="550" y="129" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="central">il peut attendre</text><text x="550" y="260" font-size="12.5" font-weight="700" fill="#b54708" text-anchor="start" dominant-baseline="central">Zones à faibles émissions</text><text x="550" y="277" font-size="11" font-weight="400" fill="#b54708" text-anchor="start" dominant-baseline="central">après l'échéance : avis négatifs,</text><text x="550" y="292" font-size="11" font-weight="400" fill="#b54708" text-anchor="start" dominant-baseline="central">amendes pour les utilisateurs</text><text x="30" y="426" font-size="11.5" font-weight="600" fill="#374151" text-anchor="start" dominant-baseline="central">RICE compare la valeur ; le coût du retard dit aussi ce que l'on perd à attendre.</text></svg>